name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: regurolog_test
          POSTGRES_PASSWORD: regurolog_test
          POSTGRES_USER: regurolog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regurolog_test -d regurolog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://regurolog_test:regurolog_test@127.0.0.1:5432/regurolog_test
      TEST_DATABASE_URL: postgresql://regurolog_test:regurolog_test@127.0.0.1:5432/regurolog_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run alembic -c apps/api/alembic.ini upgrade head
      - run: uv run pytest
      - run: uv run ruff check apps/api
      - run: uv run mypy apps/api/src

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: node --check apps/web/server.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @regurolog/web
