[tool.uv.workspace]
members = ["apps/api"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests"]
markers = ["integration: requires a migrated PostgreSQL TEST_DATABASE_URL"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
